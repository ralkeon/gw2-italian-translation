# Cloudflare Worker of the global translations database. See README.md for the setup.
name = "gw2it-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "gw2it"
database_id = "de1c15b0-05a1-4962-af50-4f3b5fb72aa1"

# Per token (and per IP for /register): the addon calls once every 2 minutes, a few times in a
# row when it has a lot to send.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# sql/*.sql imported as strings (shared with crates/server).
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
