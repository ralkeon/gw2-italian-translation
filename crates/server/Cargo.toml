[package]
name = "gw2it-server"
description = "Global translations database of Italian Translation, self-hosted (same API as server/)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gw2it-server"
path = "src/main.rs"

[dependencies]
gw2it-text.workspace = true
gw2it-translate.workspace = true
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
