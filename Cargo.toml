[workspace]
resolver = "3"
members = ["crates/proto", "crates/shim", "crates/addon", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ralkeon"]
license = "MIT"

[workspace.dependencies]
gw2it-proto = { path = "crates/proto" }
log = "0.4"
windows-sys = "0.60"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
