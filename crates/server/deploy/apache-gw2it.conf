    # Italian Translation global translations database (~/gw2it-sync, service gw2it-sync)
    ProxyPass        /gw2it/ http://127.0.0.1:8790/
    ProxyPassReverse /gw2it/ http://127.0.0.1:8790/
    <Location /gw2it/>
        LimitRequestBody 1048576
        AddOutputFilterByType DEFLATE application/json
    </Location>
    # The nightly copy of the database (export.sh), for download behind a password:
    # sudo htpasswd -c /etc/apache2/gw2it-db.htpasswd <user>
    Alias /gw2it-db/ /home/ralkeon/gw2it-sync/export/
    <Directory /home/ralkeon/gw2it-sync/export>
        AuthType Basic
        AuthName "gw2it database"
        AuthUserFile /etc/apache2/gw2it-db.htpasswd
        Require valid-user
        Options -Indexes
    </Directory>
