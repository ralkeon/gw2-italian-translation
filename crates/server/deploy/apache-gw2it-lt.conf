    # The copy adapted to the Local Translator's glossary (export-lt.sh), for the glossary's owner:
    # its own folder and password, apart from the database's (apache-gw2it.conf).
    # Inside the VirtualHost of ifalna.ralkeon.com-le-ssl.conf, then: sudo htpasswd -c /etc/apache2/gw2it-lt.htpasswd <user>
    Alias /gw2it-lt/ /home/ralkeon/gw2it-sync/export-lt/
    <Directory /home/ralkeon/gw2it-sync/export-lt>
        AuthType Basic
        AuthName "gw2it lt_sync"
        AuthUserFile /etc/apache2/gw2it-lt.htpasswd
        Require valid-user
        Options -Indexes
    </Directory>
