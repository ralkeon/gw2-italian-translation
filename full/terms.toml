# Full Italian: term decisions (see TASTE.md).
# it        = the name as shown; forms = other forms the context may need
# gender    = m/f, number = s/p (for articles and agreement)
# rejected  = not the word for THIS term in this sense; the same word can be right elsewhere, by context
#             (Monile: not the Trinket category, but "Lost Trinket" = "Monile Smarrito")
# status    = approved (by the user) | proposed | pending (open question)
# note      = why this word was chosen
# context   = where the English word shows up and what it means there, with the evidence
#             (string ids, nearby ids, wiki page, API category); when it is NOT the term

