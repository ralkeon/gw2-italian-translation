[workspace]
resolver = "3"
members = ["crates/proto", "crates/text", "crates/translate", "crates/shim", "crates/addon", "crates/server"]

[workspace.package]
version = "0.3.14"
edition = "2024"
authors = ["Ralkeon"]
license = "MIT"
repository = "https://github.com/ralkeon/gw2-italian-translation"

[workspace.dependencies]
gw2it-proto = { path = "crates/proto" }
gw2it-text = { path = "crates/text" }
gw2it-translate = { path = "crates/translate" }
log = "0.4"
windows-sys = "0.60"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
