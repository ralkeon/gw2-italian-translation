    # Italian Translation global translations database (~/gw2it-sync, service gw2it-sync)
    ProxyPass        /gw2it/ http://127.0.0.1:8790/
    ProxyPassReverse /gw2it/ http://127.0.0.1:8790/
    <Location /gw2it/>
        LimitRequestBody 1048576
        AddOutputFilterByType DEFLATE application/json
    </Location>
